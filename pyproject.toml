[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "capachinos"
version = "0.1.0"
description = "EEG analysis tools for anesthesia and caffeine studies"
readme = "README.md"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
include = ["capachinos*"]
namespaces = false